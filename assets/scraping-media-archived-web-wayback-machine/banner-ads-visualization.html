<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Ads Dataset Visualization</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            padding: 40px;
            text-align: left;
            border-bottom: 1px solid #ccc;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            padding: 0;
            border-bottom: 1px solid #ccc;
        }

        .stat-card {
            padding: 10px 8px;
            text-align: center;
            border-right: 1px solid #ccc;
        }

        .stat-card:last-child {
            border-right: none;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.6em;
        }

        .controls {
            padding: 20px;
            border-bottom: 1px solid #ccc;
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-weight: bold;
        }

        select, input {
            padding: 8px;
            border: 1px solid #ccc;
        }

        select:focus, input:focus {
            outline: 2px solid #0066cc;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .ads-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .ad-card {
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        .ad-card.scraped {
            border-left: 4px solid green;
        }

        .ad-card.not-scraped {
            border-left: 4px solid red;
        }

        .ad-image-container {
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #ccc;
        }

        .archived-timestamp {
            position: absolute;
            top: 0;
            right: 0;
            background: #333;
            color: white;
            padding: 5px 10px;
            font-size: 0.7em;
        }

        .ad-image {
            max-width: 100%;
            max-height: 100px;
            border: 1px solid #ccc;
        }

        .ad-placeholder {
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .ad-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .ad-title {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .ad-details {
            display: grid;
            gap: 0;
            margin-bottom: 20px;
        }

        .ad-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .ad-detail:last-child {
            border-bottom: 1px solid #ccc;
        }

        .ad-detail-label {
            font-weight: bold;
        }

        .ad-detail-value {
            text-align: right;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ad-source-url {
            margin-bottom: 20px;
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #ccc;
            flex: 1;
        }

        .ad-source-value {
            word-break: break-all;
            margin-top: 5px;
            font-family: monospace;
            font-size: 0.9em;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border: 1px solid #ccc;
            font-size: 0.8em;
            margin: 2px;
            border-radius: 3px;
        }

        .status-scraped {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .status-404 {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        .status-403 {
            background: #ffeaa7;
            color: #6c5ce7;
            border-color: #fdcb6e;
        }

        .status-mismatched_dimensions,
        .status-mismatched-dimensions {
            background: #fff3cd;
            color: #856404;
            border-color: #ffeaa7;
        }

        .status-not_bytes,
        .status-not-bytes {
            background: #e2e3e5;
            color: #383d41;
            border-color: #d6d8db;
        }

        .appearances-count {
            background: #007bff;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .dimensions {
            padding: 4px 8px;
            border: 1px solid #ccc;
            font-size: 0.8em;
            font-weight: bold;
            border-radius: 3px;
        }

        .expand-button {
            padding: 10px 15px;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }

        .appearances-list {
            margin-top: 0;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            display: none;
            background: #f9f9f9;
            margin: 0 -20px -20px -20px;
            padding: 20px;
        }

        .appearances-list.expanded {
            display: block;
        }

        .appearance-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .appearance-image-container {
            text-align: center;
            background: #f5f5f5;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 1px solid #ccc;
        }

        .appearance-image {
            max-width: 100%;
            max-height: 60px;
            border: 1px solid #ccc;
        }

        .appearance-detail {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .appearance-detail:last-child {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            margin: 20px;
            border: 1px solid #f5c6cb;
            border-radius: 3px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            
            .control-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .ads-grid {
                grid-template-columns: 1fr;
                padding: 10px;
                gap: 2px;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-ads">-</div>
                <div class="stat-label">Total Ads</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="scraped-ads">-</div>
                <div class="stat-label">Scraped Appearances</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="failed-404">-</div>
                <div class="stat-label">404 Appearances</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="failed-403">-</div>
                <div class="stat-label">403 Appearances</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="failed-mismatched">-</div>
                <div class="stat-label">Mismatched Appearances</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="failed-not-bytes">-</div>
                <div class="stat-label">Not Bytes Appearances</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-appearances">-</div>
                <div class="stat-label">Total Appearances</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="status-filter">Status Filter:</label>
                <select id="status-filter">
                    <option value="all">All Ads</option>
                    <option value="scraped">Successfully Scraped</option>
                    <option value="404">Failed (404)</option>
                    <option value="403">Failed (403)</option>
                    <option value="mismatched_dimensions">Mismatched Dimensions</option>
                    <option value="not_bytes">Not Bytes</option>
                </select>
            </div>
            <div class="control-group">
                <label for="sort-by">Sort By:</label>
                <select id="sort-by">
                    <option value="appearances">Most Appearances</option>
                    <option value="dimensions">Largest Dimensions</option>
                </select>
            </div>
            <div class="control-group search-box">
                <label for="search">Search:</label>
                <input type="text" id="search" placeholder="Search by URL, alt text, or href...">
            </div>
        </div>

        <div id="loading" class="loading">
            Loading banner ads data...
        </div>

        <div id="error" class="error" style="display: none;">
            Error loading data. Please make sure the results.json file is accessible.
        </div>

        <div id="ads-container" class="ads-grid" style="display: none;">
            <!-- Ads will be populated here -->
        </div>
    </div>

    <script>
        let adsData = {};
        let filteredAds = [];

        // Load and parse the JSON data
        async function loadData() {
            try {
                const response = await fetch('data/results.json');
                if (!response.ok) {
                    throw new Error('Failed to load data');
                }
                adsData = await response.json();
                processData();
                updateStats();
                renderAds();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('ads-container').style.display = 'grid';
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }

        // Process and prepare data for display
        function processData() {
            filteredAds = Object.entries(adsData).map(([id, data]) => {
                const firstAppearance = data.appearances && data.appearances[0];
                const isScraped = data.appearances && data.appearances.some(app => app.ad_snapshot_status === 'scraped');
                const isMismatchedDimensions = data.appearances && data.appearances.some(app => app.ad_snapshot_status === 'mismatched_dimensions');
                
                // Find the best appearance to show as main image (prefer scraped, then mismatched_dimensions)
                const bestAppearance = data.appearances && data.appearances.find(app => app.ad_snapshot_status === 'scraped') ||
                                     data.appearances && data.appearances.find(app => app.ad_snapshot_status === 'mismatched_dimensions') ||
                                     firstAppearance;
                
                const hasImage = bestAppearance && (bestAppearance.ad_snapshot_status === 'scraped' || bestAppearance.ad_snapshot_status === 'mismatched_dimensions');
                
                // Get all unique statuses for this ad
                const allStatuses = data.appearances ? [...new Set(data.appearances.map(app => app.ad_snapshot_status))] : [];
                
                return {
                    id,
                    src: data.src,
                    appearances: data.appearances || [],
                    isScraped,
                    isMismatchedDimensions,
                    hasImage,
                    firstAppearance,
                    bestAppearance,
                    allStatuses,
                    imagePath: hasImage ? bestAppearance.ad_snapshot_path : null,
                    searchText: `${data.src} ${firstAppearance?.alt || ''} ${firstAppearance?.ad_href || ''}`.toLowerCase()
                };
            });
        }

        // Update statistics
        function updateStats() {
            const totalAds = Object.keys(adsData).length;
            let scrapedCount = 0;
            let failed404Count = 0;
            let failed403Count = 0;
            let failedMismatchedCount = 0;
            let failedNotBytesCount = 0;
            let totalAppearances = 0;

            Object.values(adsData).forEach(ad => {
                if (ad.appearances) {
                    totalAppearances += ad.appearances.length;
                    
                    // Count each appearance by its individual status
                    ad.appearances.forEach(app => {
                        switch (app.ad_snapshot_status) {
                            case 'scraped':
                                scrapedCount++;
                                break;
                            case '404':
                                failed404Count++;
                                break;
                            case '403':
                                failed403Count++;
                                break;
                            case 'mismatched_dimensions':
                                failedMismatchedCount++;
                                break;
                            case 'not_bytes':
                                failedNotBytesCount++;
                                break;
                        }
                    });
                }
            });

            document.getElementById('total-ads').textContent = totalAds.toLocaleString();
            document.getElementById('scraped-ads').textContent = scrapedCount.toLocaleString();
            document.getElementById('failed-404').textContent = failed404Count.toLocaleString();
            document.getElementById('failed-403').textContent = failed403Count.toLocaleString();
            document.getElementById('failed-mismatched').textContent = failedMismatchedCount.toLocaleString();
            document.getElementById('failed-not-bytes').textContent = failedNotBytesCount.toLocaleString();
            document.getElementById('total-appearances').textContent = totalAppearances.toLocaleString();
        }

        // Render ads to the page
        function renderAds() {
            const container = document.getElementById('ads-container');
            const statusFilter = document.getElementById('status-filter').value;
            const sortBy = document.getElementById('sort-by').value;
            const searchTerm = document.getElementById('search').value.toLowerCase();

            // Filter ads
            let filtered = filteredAds.filter(ad => {
                let statusMatch = false;
                
                if (statusFilter === 'all') {
                    statusMatch = true;
                } else if (statusFilter === 'scraped') {
                    statusMatch = ad.isScraped;
                } else {
                    // Check if any appearance has the specific failure status
                    statusMatch = ad.appearances.some(app => app.ad_snapshot_status === statusFilter);
                }
                
                const searchMatch = !searchTerm || ad.searchText.includes(searchTerm);
                return statusMatch && searchMatch;
            });

            // Sort ads
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'appearances':
                        return b.appearances.length - a.appearances.length;
                    case 'dimensions':
                        const aArea = (a.firstAppearance?.width || 0) * (a.firstAppearance?.height || 0);
                        const bArea = (b.firstAppearance?.width || 0) * (b.firstAppearance?.height || 0);
                        return bArea - aArea;
                    default:
                        return 0;
                }
            });

            // Render ads
            container.innerHTML = filtered.map(ad => createAdCard(ad)).join('');
        }

        // Create HTML for a single ad card
        function createAdCard(ad) {
            const appearance = ad.bestAppearance || ad.firstAppearance;
            const title = appearance?.alt || '[No Alt Text]';
            const dimensions = appearance ? `${appearance.width}×${appearance.height}` : 'Unknown';
            
            // Determine status text and badge class
            const statusText = ad.allStatuses.length > 1 ? 
                `Multiple Statuses (${ad.allStatuses.length})` : 
                (ad.allStatuses[0] === '404' ? 'Not Found (404)' :
                 ad.allStatuses[0] === '403' ? 'Forbidden (403)' :
                 ad.allStatuses[0] === 'mismatched_dimensions' ? 'Mismatched Dimensions' :
                 ad.allStatuses[0] === 'not_bytes' ? 'Not Bytes' :
                 ad.allStatuses[0] === 'scraped' ? 'Scraped' :
                 ad.allStatuses[0] || 'Unknown');

            const imageHtml = ad.hasImage && ad.imagePath 
                ? `<img src="${ad.imagePath}" alt="${title}" class="ad-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                   <div class="ad-placeholder" style="display: none;">Image not found</div>
                   <div class="archived-timestamp">Archived ad snapshot displayed: ${formatTimestamp(appearance?.ad_snapshot_timestamp)}</div>`
                : `<div class="ad-placeholder">No image available (${statusText})</div>`;

            // Show all statuses
            const statusDisplayHtml = ad.allStatuses.length > 1 ? `
                <div class="ad-detail">
                    <span class="ad-detail-label">Statuses:</span>
                    <span class="ad-detail-value">${ad.allStatuses.map(status => 
                        `<span class="status-badge status-${status.replace('_', '-')}">${status}</span>`
                    ).join(' ')}</span>
                </div>` : `
                <div class="ad-detail">
                    <span class="ad-detail-label">Status:</span>
                    <span class="status-badge status-${ad.allStatuses[0]?.replace('_', '-') || 'unknown'}">${statusText}</span>
                </div>`;

            // Helper function to extract actual dimensions from filename
        function extractActualDimensions(filePath) {
            if (!filePath) return null;
            
            // Extract filename from path
            const filename = filePath.split('/').pop();
            
            // Look for pattern like "20000510012408-20131224050834.1x1.gif"
            const dimensionMatch = filename.match(/\.(\d+)x(\d+)\./);
            
            if (dimensionMatch) {
                return {
                    width: parseInt(dimensionMatch[1]),
                    height: parseInt(dimensionMatch[2])
                };
            }
            
            return null;
        }

        // Helper function to calculate time skew
            function calculateTimeSkew(webTimestamp, adTimestamp) {
                if (!webTimestamp || !adTimestamp) return 'N/A';
                
                const webDate = new Date(
                    webTimestamp.substring(0, 4),  // year
                    webTimestamp.substring(4, 6) - 1,  // month (0-indexed)
                    webTimestamp.substring(6, 8),  // day
                    webTimestamp.substring(8, 10), // hour
                    webTimestamp.substring(10, 12), // minute
                    webTimestamp.substring(12, 14)  // second
                );
                
                const adDate = new Date(
                    adTimestamp.substring(0, 4),
                    adTimestamp.substring(4, 6) - 1,
                    adTimestamp.substring(6, 8),
                    adTimestamp.substring(8, 10),
                    adTimestamp.substring(10, 12),
                    adTimestamp.substring(12, 14)
                );
                
                const diffMs = adDate.getTime() - webDate.getTime();
                const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
                
                if (diffDays === 0) return 'Same day';
                if (diffDays > 0) return `+${diffDays} days`;
                return `${diffDays} days`;
            }

            const appearancesHtml = ad.appearances.map(app => {
                const timeSkew = calculateTimeSkew(app.web_page_snapshot_timestamp, app.ad_snapshot_timestamp);
                const statusClass = `status-${(app.ad_snapshot_status || 'unknown').replace('_', '-')}`;
                
                // Check if this appearance has a different ad timestamp than the best appearance
                const bestAdTimestamp = ad.bestAppearance?.ad_snapshot_timestamp;
                const showDifferentImage = app.ad_snapshot_timestamp && 
                                         app.ad_snapshot_timestamp !== bestAdTimestamp && 
                                         app.ad_snapshot_path &&
                                         (app.ad_snapshot_status === 'scraped' || app.ad_snapshot_status === 'mismatched_dimensions');
                
                // Extract actual dimensions for mismatched_dimensions status
                let actualDimensionsHtml = '';
                if (app.ad_snapshot_status === 'mismatched_dimensions' && app.ad_snapshot_path) {
                    const actualDims = extractActualDimensions(app.ad_snapshot_path);
                    if (actualDims) {
                        actualDimensionsHtml = `
                        <div class="appearance-detail">
                            <strong>Expected Dimensions:</strong> <span>${app.width}×${app.height}</span>
                        </div>
                        <div class="appearance-detail">
                            <strong>Actual Dimensions:</strong> <span>${actualDims.width}×${actualDims.height}</span>
                        </div>`;
                    }
                } else if (app.width && app.height) {
                    actualDimensionsHtml = `
                    <div class="appearance-detail">
                        <strong>Dimensions:</strong> <span>${app.width}×${app.height}</span>
                    </div>`;
                }

                // Image HTML for different snapshots
                const appearanceImageHtml = showDifferentImage ? `
                    <div class="appearance-image-container">
                        <img src="${app.ad_snapshot_path}" alt="${title}" class="appearance-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="ad-placeholder" style="display: none;">Different snapshot image not found</div>
                    </div>` : '';
                
                return `
                <div class="appearance-item">
                    <div class="appearance-detail">
                        <strong>Page:</strong> <span>${app.web_page_original_url}</span>
                    </div>
                    <div class="appearance-detail">
                        <strong>Page Timestamp:</strong> <span>${formatTimestamp(app.web_page_snapshot_timestamp)}</span>
                    </div>
                    <div class="appearance-detail">
                        <strong>Ad Timestamp:</strong> <span>${formatTimestamp(app.ad_snapshot_timestamp)}</span>
                    </div>
                    ${app.ad_snapshot_timestamp ? `
                    <div class="appearance-detail">
                        <strong>Time Skew:</strong> <span>${timeSkew}</span>
                    </div>` : ''}
                    ${actualDimensionsHtml}
                    <div class="appearance-detail">
                        <strong>Link:</strong> <span>${app.ad_href || 'N/A'}</span>
                    </div>
                    <div class="appearance-detail">
                        <strong>Status:</strong> <span class="status-badge ${statusClass}">${app.ad_snapshot_status || 'unknown'}</span>
                    </div>
                    ${appearanceImageHtml}
                </div>
            `;
            }).join('');

            return `
                <div class="ad-card ${ad.isScraped ? 'scraped' : 'not-scraped'}">
                    <div class="ad-image-container">
                        ${imageHtml}
                    </div>
                    <div class="ad-info">
                        <div class="ad-title">${title}</div>
                        <div class="ad-details">
                            ${statusDisplayHtml}
                            <div class="ad-detail">
                                <span class="ad-detail-label">Appearances:</span>
                                <span class="appearances-count">${ad.appearances.length}</span>
                            </div>
                        </div>
                        <div class="ad-source-url">
                            <div class="ad-detail-label">Source URL:</div>
                            <div class="ad-source-value">${ad.src}</div>
                        </div>
                        <button class="expand-button" onclick="toggleAppearances('${ad.id}')">
                            Show All Appearances
                        </button>
                        <div id="appearances-${ad.id}" class="appearances-list">
                            ${appearancesHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // Toggle appearances list visibility
        function toggleAppearances(adId) {
            const list = document.getElementById(`appearances-${adId}`);
            const button = list.previousElementSibling;
            
            if (list.classList.contains('expanded')) {
                list.classList.remove('expanded');
                button.textContent = 'Show All Appearances';
            } else {
                list.classList.add('expanded');
                button.textContent = 'Hide Appearances';
            }
        }

        // Format timestamp for display
        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            const year = timestamp.substr(0, 4);
            const month = timestamp.substr(4, 2);
            const day = timestamp.substr(6, 2);
            const hour = timestamp.substr(8, 2);
            const minute = timestamp.substr(10, 2);
            const second = timestamp.substr(12, 2);
            return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
        }

        // Event listeners
        document.getElementById('status-filter').addEventListener('change', renderAds);
        document.getElementById('sort-by').addEventListener('change', renderAds);
        document.getElementById('search').addEventListener('input', renderAds);

        // Initialize
        loadData();
    </script>
</body>
</html>
